<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我的 Flask 部落格</title>
</head>
<body>
    <h1>📚 我的 Flask 部落格</h1>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{{ url_for('show_post', post_id=post.id) }}">{{ post.title }}</a>
                — <em>{{ post.author }}</em>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
